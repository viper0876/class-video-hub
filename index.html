<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Hub</title>
    <style>
        body { background-color: #0f0f0f; color: #ffffff; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #ff0000; margin-top: 40px; font-size: 2.5rem; }
        p { color: #aaaaaa; font-size: 1.1rem; }
        .video-grid { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 40px; }
        .video-card { width: 100%; max-width: 700px; background: #1f1f1f; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .video-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 12px; text-align: left; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Class Video Portal</h1>
    <p>Real videos for the class grid. Tap play to watch!</p>

    <div class="video-grid">
        
        <!-- VIDEO 1 -->
        <div class="video-card">
            <div class="video-title">Featured Video</div>
            <!-- Notice the full '/embed/dQw4w9WgXcQ' path below so the video player functions correctly -->
            <iframe src="https://youtube-nocookie.com" allowfullscreen></iframe>
        </div>

    </div>

</body>
</html>
